<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pet&Style: roupinhas, acessórios, camas e brinquedos para cães e gatos." />
  <title>Pet&Style | Loja Virtual para Pets</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS compilado do SCSS (carregado depois do Tailwind) -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="header sticky top-0 z-50">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">

      <a href="#" class="header__logo text-2xl">
        Pet<span class="header__logo-accent">&Style</span>
      </a>

      <nav
        id="menu"
        class="header__nav absolute left-0 right-0 top-full hidden flex-col gap-2 px-4 pb-4 md:static md:flex md:flex-row md:items-center md:gap-8 md:p-0"
        aria-label="Menu principal"
      >
        <a href="#produtos" class="header__link py-2">Produtos</a>
        <a href="#depoimentos" class="header__link py-2">Depoimentos</a>
        <a href="#contato" class="header__link py-2">Contato</a>
        <a href="#contato" class="header__cta inline-flex items-center justify-center px-5 py-2 text-sm">Fale conosco</a>
      </nav>

      <button
        id="menu-toggle"
        type="button"
        class="header__toggle p-2 md:hidden"
        aria-label="Abrir menu"
        aria-controls="menu"
        aria-expanded="false"
      >
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

    </div>
  </header>

  <main>
    <!-- Hero: etapa 5 -->
    <!-- Produtos: etapa 6 -->
    <!-- Depoimentos: etapa 7 -->
    <!-- Contato: etapa 8 -->
  </main>

  <!-- Footer: etapa 8 -->

  <script>
    const toggle = document.getElementById('menu-toggle');
    const menu = document.getElementById('menu');

    toggle.addEventListener('click', () => {
      const isOpen = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!isOpen));
      menu.classList.toggle('hidden');
      menu.classList.toggle('flex');
    });
  </script>

</body>
</html>
